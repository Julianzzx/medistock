<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Farmacias | Medistock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.6s ease-out; }
  </style>
    <link rel="icon" type="image/png" href="/Imagenes/Logo.png"/>
</head>
<body class="relative bg-gradient-to-r from-indigo-600 via-sky-600 to-cyan-500 min-h-screen flex flex-col overflow-x-hidden">

  <div class="absolute top-10 left-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
  <div class="absolute bottom-20 right-20 w-52 h-52 bg-cyan-300/20 rounded-full blur-2xl"></div>
  <i class="ph ph-first-aid-kit absolute top-1/4 left-12 text-white/20 text-8xl rotate-12"></i>

    <!-- ══ HEADER STICKY MEDISTOCK ══════════════════════════════════════ -->
    <style>
        body { margin-top: 62px !important; }
        #ms-header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100vw !important;
            z-index: 99999 !important;
            background: linear-gradient(90deg, rgba(30,27,100,0.82) 0%, rgba(14,116,144,0.70) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 4px 24px rgba(0,0,0,0.22);
            box-sizing: border-box;
            padding: 10px 28px;
        }
        #ms-header-inner {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        #ms-header .ms-accent-line {
            width: 3px; height: 32px; border-radius: 9999px;
            background: linear-gradient(180deg,#67e8f9,#818cf8);
            flex-shrink: 0;
        }
        #ms-header .ms-logo-link {
            display: flex; align-items: center;
            gap: 12px; text-decoration: none;
        }
        #ms-header .ms-logo-wrap {
            position: relative; flex-shrink: 0;
        }
        #ms-header .ms-logo-glow {
            position: absolute; inset: 0;
            background: rgba(103,232,249,0.25);
            filter: blur(10px); border-radius: 9999px;
        }
        #ms-header .ms-logo-img {
            position: relative; height: 38px; width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }
        #ms-header .ms-logo-img:hover { transform: scale(1.1); }
        #ms-header .ms-brand { line-height: 1; }
        #ms-header .ms-brand-name {
            color: white; font-weight: 900; font-size: 1rem;
            letter-spacing: 0.08em; font-family: Inter, sans-serif;
            text-shadow: 0 1px 8px rgba(0,0,0,0.25);
        }
        #ms-header .ms-brand-name span { color: #67e8f9; }
        #ms-header .ms-brand-sub {
            color: rgba(255,255,255,0.45); font-size: 0.62rem;
            font-weight: 500; letter-spacing: 0.12em;
            text-transform: uppercase; margin-top: 2px;
        }
        #ms-header .ms-sep {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.12), transparent);
            margin-left: 8px;
        }
        #ms-header .ms-status {
            display: flex; align-items: center;
            gap: 6px; flex-shrink: 0;
        }
        #ms-header .ms-dot {
            width: 7px; height: 7px; border-radius: 9999px;
            background: #34d399;
            box-shadow: 0 0 8px rgba(52,211,153,0.8);
            animation: ms-pulse 2s infinite;
        }
        #ms-header .ms-status-txt {
            color: rgba(255,255,255,0.45); font-size: 0.68rem;
            font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
        }
        @keyframes ms-pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
    </style>
    <header id="ms-header">
        <div id="ms-header-inner">
            <div class="ms-accent-line"></div>
            <a href="/" class="ms-logo-link">
                <div class="ms-logo-wrap">
                    <div class="ms-logo-glow"></div>
                    <img src="/Imagenes/Logo.png" alt="MEDISTOCK" class="ms-logo-img"/>
                </div>
                <div class="ms-brand">
                    <div class="ms-brand-name">MEDI<span>STOCK</span></div>
                    <div class="ms-brand-sub">Gestión Inteligente</div>
                </div>
            </a>
            <div class="ms-sep"></div>
            <div class="ms-status">
                <div class="ms-dot"></div>
                <span class="ms-status-txt">Sistema activo</span>
            </div>
        </div>
    </header>
    <!-- ══ FIN HEADER ═══════════════════════════════════════════════════ -->

<main class="flex-1 w-full max-w-7xl mx-auto p-10 animate-fade-in">

    <form th:action="@{/manager/farmaciamanager}" method="get" class="flex flex-col md:flex-row items-center gap-4 mb-10">
      <input type="text" name="keyword" th:value="${keyword}" placeholder="Buscar farmacia..."
             class="w-full md:w-1/3 p-3 rounded-xl border border-white/30 bg-white/20 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      
      <button type="submit"
              class="px-6 py-3 bg-indigo-700 text-white rounded-2xl shadow hover:shadow-lg hover:scale-105 hover:bg-indigo-800 transition-all">
        Buscar
      </button>

      <a th:href="@{/manager/farmaciamanager}"
         class="px-6 py-3 bg-gray-600 text-white rounded-2xl shadow hover:shadow-lg hover:scale-105 hover:bg-gray-700 transition-all">
        Mostrar Todo
      </a>
    </form>

    <div class="grid gap-10 sm:grid-cols-2 lg:grid-cols-3" th:if="${!#lists.isEmpty(farmacias)}">
      <div th:each="f : ${farmacias}"
           class="flex flex-col items-start justify-between gap-6 bg-white/30 backdrop-blur-xl p-8 rounded-3xl border border-white/40 shadow-xl hover:shadow-indigo-500/40 hover:scale-[1.04] transition relative overflow-hidden">
        
        <div class="w-24 h-24 flex items-center justify-center rounded-full bg-indigo-100 text-indigo-600 shadow-lg">
          <i class="ph ph-hospital text-6xl"></i>
        </div>

        <div>
          <h3 class="text-2xl font-bold text-white drop-shadow mb-2 flex items-center gap-2">
            <i class="ph ph-buildings text-xl"></i>
            <span th:text="${f.nombre}">Farmacia</span>
          </h3>
          <p class="flex items-center gap-2 text-white/90 text-lg">
            <i class="ph ph-map-pin text-lg"></i>
            <span th:text="${f.direccion}">Dirección no registrada</span>
          </p>
        </div>

        <a th:href="@{'/manager/farmacias/' + ${f.id} + '/medicamentos'}"
           class="w-full flex items-center justify-center gap-3 px-8 py-3 bg-gradient-to-r from-indigo-700 to-cyan-500 text-white rounded-2xl font-semibold text-lg shadow hover:shadow-lg hover:scale-105 transition">
          <i class="ph ph-capsules text-xl"></i>
          Ver Medicamentos
        </a>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(farmacias)}"
         class="text-center text-white/90 text-xl font-semibold mt-10">
      No hay farmacias registradas para esta EPS.
    </div>

    <div th:if="${totalPages > 1}" class="flex justify-center gap-4 mt-10">
      <a th:if="${currentPage > 0}"
         th:href="@{/manager/farmaciamanager(page=${currentPage-1}, keyword=${keyword})}"
         class="px-4 py-2 bg-indigo-700 text-white rounded-lg hover:bg-indigo-800 transition">Anterior</a>

      <span class="px-4 py-2 bg-white/20 text-white rounded-lg">
        Página <span th:text="${currentPage + 1}">1</span> de <span th:text="${totalPages}">1</span>
      </span>

      <a th:if="${currentPage + 1 < totalPages}"
         th:href="@{/manager/farmaciamanager(page=${currentPage+1}, keyword=${keyword})}"
         class="px-4 py-2 bg-indigo-700 text-white rounded-lg hover:bg-indigo-800 transition">Siguiente</a>
    </div>

  </main>
</body>
</html>
