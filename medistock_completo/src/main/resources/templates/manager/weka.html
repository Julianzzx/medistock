<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Modelo Predictivo WEKA | Medistock</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>

        /* ════════════════════════════════════════
           BASE
        ════════════════════════════════════════ */
        body{
            background:
                linear-gradient(
                    135deg,
                    #6366f1 0%,
                    #38bdf8 50%,
                    #22d3ee 100%
                );

            min-height:100vh;
            font-family:'Inter',sans-serif;
        }

        /* ════════════════════════════════════════
           CONTENEDOR PRINCIPAL
        ════════════════════════════════════════ */
        .main-container{
            background:rgba(255,255,255,0.10);

            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,0.20);

            box-shadow:
                0 10px 35px rgba(0,0,0,0.15),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        /* ════════════════════════════════════════
           CARDS
        ════════════════════════════════════════ */
        .card{
            position:relative;
            overflow:hidden;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .25s ease;
        }

        .card:hover{
            transform:translateY(-4px);

            box-shadow:0 12px 28px rgba(0,0,0,0.18);

            border-color:rgba(255,255,255,0.45);
        }

        .card::before{
            content:"";

            position:absolute;
            inset:0;

            background:
                linear-gradient(
                    120deg,
                    rgba(255,255,255,0.18),
                    transparent 45%
                );

            opacity:0;
            transition:opacity .3s ease;

            pointer-events:none;
        }

        .card:hover::before{
            opacity:1;
        }

        /* ════════════════════════════════════════
           HERO
        ════════════════════════════════════════ */
        .hero-pred{
            background:rgba(255,255,255,0.14);

            border:1px solid rgba(255,255,255,0.24);

            backdrop-filter:blur(14px);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.10),
                0 10px 30px rgba(0,0,0,0.12);
        }

        /* ════════════════════════════════════════
           TABLAS
        ════════════════════════════════════════ */
        .tabla-row{
            border-bottom:1px solid rgba(255,255,255,0.08);

            transition:
                background .2s ease,
                transform .2s ease;
        }

        .tabla-row:hover{
            background:rgba(255,255,255,0.07);
        }

        .tabla-row:last-child{
            border-bottom:none;
        }

        /* ════════════════════════════════════════
           PROGRESS
        ════════════════════════════════════════ */
        .progress-track{
            width:100%;
            height:6px;

            border-radius:9999px;

            overflow:hidden;

            background:rgba(255,255,255,0.10);

            margin-top:5px;
        }

        .progress-fill{
            height:100%;
            border-radius:9999px;

            transition:width .5s ease;
        }

        /* ════════════════════════════════════════
           RANKS
        ════════════════════════════════════════ */
        .rank-badge{
            width:1.7rem;
            height:1.7rem;

            border-radius:9999px;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:.72rem;
            font-weight:800;

            flex-shrink:0;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.15),
                0 2px 8px rgba(0,0,0,0.18);
        }

        .rank-1{
            background:
                linear-gradient(
                    135deg,
                    #f59e0b,
                    #d97706
                );

            color:#111827;
        }

        .rank-2{
            background:
                linear-gradient(
                    135deg,
                    #cbd5e1,
                    #94a3b8
                );

            color:#111827;
        }

        .rank-3{
            background:
                linear-gradient(
                    135deg,
                    #b45309,
                    #78350f
                );

            color:white;
        }

        .rank-other{
            background:rgba(255,255,255,0.12);
            color:rgba(255,255,255,0.65);
        }

        /* ════════════════════════════════════════
           CHIPS
        ════════════════════════════════════════ */
        .chip{
            display:inline-flex;
            align-items:center;
            gap:6px;

            padding:4px 12px;

            border-radius:9999px;

            font-size:.70rem;
            font-weight:700;

            letter-spacing:.05em;
            text-transform:uppercase;

            backdrop-filter:blur(10px);
        }

        /* ════════════════════════════════════════
           SCROLL
        ════════════════════════════════════════ */
        ::-webkit-scrollbar{
            width:10px;
        }

        ::-webkit-scrollbar-track{
            background:rgba(255,255,255,0.08);
        }

        ::-webkit-scrollbar-thumb{
            background:rgba(255,255,255,0.22);
            border-radius:9999px;
        }

        /* ════════════════════════════════════════
           RESPONSIVE
        ════════════════════════════════════════ */
        @media(max-width:768px){

            .hero-pred p.text-5xl,
            .hero-pred p.text-6xl{
                font-size:2.2rem !important;
            }

        }

    </style>
    <link rel="icon" type="image/png" href="/Imagenes/Logo.png"/>
</head>

<body class="py-10 px-4 flex justify-center">
<div class="w-full max-w-7xl flex flex-col gap-8">

    <!-- ════════════════════════════════════════
         HEADER
    ════════════════════════════════════════ -->

    <!-- ══ HEADER STICKY MEDISTOCK ══════════════════════════════════════ -->
    <style>
        body { margin-top: 62px !important; }
        #ms-header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100vw !important;
            z-index: 99999 !important;
            background: linear-gradient(90deg, rgba(30,27,100,0.82) 0%, rgba(14,116,144,0.70) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 4px 24px rgba(0,0,0,0.22);
            box-sizing: border-box;
            padding: 10px 28px;
        }
        #ms-header-inner {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        #ms-header .ms-accent-line {
            width: 3px; height: 32px; border-radius: 9999px;
            background: linear-gradient(180deg,#67e8f9,#818cf8);
            flex-shrink: 0;
        }
        #ms-header .ms-logo-link {
            display: flex; align-items: center;
            gap: 12px; text-decoration: none;
        }
        #ms-header .ms-logo-wrap {
            position: relative; flex-shrink: 0;
        }
        #ms-header .ms-logo-glow {
            position: absolute; inset: 0;
            background: rgba(103,232,249,0.25);
            filter: blur(10px); border-radius: 9999px;
        }
        #ms-header .ms-logo-img {
            position: relative; height: 38px; width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }
        #ms-header .ms-logo-img:hover { transform: scale(1.1); }
        #ms-header .ms-brand { line-height: 1; }
        #ms-header .ms-brand-name {
            color: white; font-weight: 900; font-size: 1rem;
            letter-spacing: 0.08em; font-family: Inter, sans-serif;
            text-shadow: 0 1px 8px rgba(0,0,0,0.25);
        }
        #ms-header .ms-brand-name span { color: #67e8f9; }
        #ms-header .ms-brand-sub {
            color: rgba(255,255,255,0.45); font-size: 0.62rem;
            font-weight: 500; letter-spacing: 0.12em;
            text-transform: uppercase; margin-top: 2px;
        }
        #ms-header .ms-sep {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.12), transparent);
            margin-left: 8px;
        }
        #ms-header .ms-status {
            display: flex; align-items: center;
            gap: 6px; flex-shrink: 0;
        }
        #ms-header .ms-dot {
            width: 7px; height: 7px; border-radius: 9999px;
            background: #34d399;
            box-shadow: 0 0 8px rgba(52,211,153,0.8);
            animation: ms-pulse 2s infinite;
        }
        #ms-header .ms-status-txt {
            color: rgba(255,255,255,0.45); font-size: 0.68rem;
            font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
        }
        @keyframes ms-pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
    </style>
    <header id="ms-header">
        <div id="ms-header-inner">
            <div class="ms-accent-line"></div>
            <a href="/" class="ms-logo-link">
                <div class="ms-logo-wrap">
                    <div class="ms-logo-glow"></div>
                    <img src="/Imagenes/Logo.png" alt="MEDISTOCK" class="ms-logo-img"/>
                </div>
                <div class="ms-brand">
                    <div class="ms-brand-name">MEDI<span>STOCK</span></div>
                    <div class="ms-brand-sub">Gestión Inteligente</div>
                </div>
            </a>
            <div class="ms-sep"></div>
            <div class="ms-status">
                <div class="ms-dot"></div>
                <span class="ms-status-txt">Sistema activo</span>
            </div>
        </div>
    </header>
    <!-- ══ FIN HEADER ═══════════════════════════════════════════════════ -->

<!-- ════════════════════════════════════════
         CONTENIDO
    ════════════════════════════════════════ -->
    <div class="main-container rounded-3xl p-8 md:p-10 flex flex-col gap-8">

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">

            <div class="card rounded-2xl p-4 text-center border border-white/30 bg-white/40">
                <div class="text-2xl font-extrabold text-emerald-800"
                     th:text="${accuracyCv}">
                    —
                </div>

                <div class="text-xs font-semibold mt-1 text-black/50">
                    Accuracy CV-10
                </div>
            </div>

            <div class="card rounded-2xl p-4 text-center border border-white/30 bg-white/40">
                <div class="text-2xl font-extrabold text-sky-900"
                     th:text="${kappa}">
                    —
                </div>

                <div class="text-xs font-semibold mt-1 text-black/50">
                    Kappa
                </div>
            </div>

            <div class="card rounded-2xl p-4 text-center border border-white/30 bg-white/40">
                <div class="text-2xl font-extrabold text-indigo-900"
                     th:text="${numInstancias}">
                    —
                </div>

                <div class="text-xs font-semibold mt-1 text-black/50">
                    Instancias
                </div>
            </div>

            <div class="card rounded-2xl p-4 text-center border border-white/30 bg-white/40">
                <div class="text-2xl font-extrabold text-cyan-900"
                     th:text="${numAtributos}">
                    —
                </div>

                <div class="text-xs font-semibold mt-1 text-black/50">
                    Atributos
                </div>
            </div>

            <div class="card rounded-2xl p-4 text-center border border-white/30 bg-white/40">
                <div class="text-2xl font-extrabold text-violet-900"
                     th:text="${numClases}">
                    —
                </div>

                <div class="text-xs font-semibold mt-1 text-black/50">
                    Clases
                </div>
            </div>

            <div class="card rounded-2xl p-4 text-center border border-white/30 bg-white/40">
                <div class="text-2xl font-extrabold text-amber-900"
                     th:text="${profundidadArbol}">
                    —
                </div>

                <div class="text-xs font-semibold mt-1 text-black/50">
                    Profundidad
                </div>
            </div>

            <div class="card rounded-2xl p-4 text-center border border-white/30 bg-white/40">
                <div class="text-2xl font-extrabold text-rose-900"
                     th:text="${numHojas}">
                    —
                </div>

                <div class="text-xs font-semibold mt-1 text-black/50">
                    Hojas
                </div>
            </div>

        </div>

        <!-- Predicción -->
        <div th:if="${resultado != null and !resultado.tieneError()}"
             class="hero-pred rounded-3xl p-10 text-center">

            <p class="chip bg-emerald-500/20 text-emerald-100 border border-emerald-400/30 mx-auto mb-5">

                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>

                Predicción automática

            </p>

            <p class="text-5xl md:text-6xl font-black text-indigo-950 mb-4"
               th:text="${resultado.medicamentoPredicho}">
                —
            </p>

            <p class="text-sm text-indigo-950/60">

                Generado con datos reales ·
                <span th:text="${resultado.mes}">?</span> /
                <span th:text="${resultado.anio}">?</span>

            </p>

        </div>

        <!-- Tabla -->
        <div class="grid grid-cols-1 gap-6">

            <div class="bg-white/10 rounded-2xl border border-white/20 overflow-hidden">

                <!-- Header tabla -->
                <div class="px-6 py-4 flex items-center justify-between border-b border-white/10">

                    <div class="flex items-center gap-2 font-bold text-base text-indigo-950">

                        <i class="ph ph-chart-bar text-amber-300 text-xl"></i>

                        Histórico general

                    </div>

                    <span class="chip bg-amber-400/15 text-amber-100 border border-amber-400/25">

                        Todos los tiempos

                    </span>

                </div>

                <!-- Cabecera -->
                <div class="grid px-6 py-2"
                     style="
                        grid-template-columns:1.8rem 1fr 5rem 5rem 4rem;
                        font-size:0.68rem;
                        font-weight:700;
                        letter-spacing:0.07em;
                        text-transform:uppercase;
                        color:rgba(30,27,75,0.45)
                     ">

                    <span>#</span>
                    <span class="pl-3">Medicamento</span>
                    <span class="text-right">Solic.</span>
                    <span class="text-right">Unid.</span>
                    <span class="text-right">%</span>

                </div>

                <!-- Datos -->
                <div th:if="${topHistorico != null and !topHistorico.empty}">

                    <div th:each="item : ${topHistorico}"
                         class="tabla-row grid items-center px-6 py-3"
                         style="grid-template-columns:1.8rem 1fr 5rem 5rem 4rem">

                        <!-- Rank -->
                        <span class="rank-badge"
                              th:classappend="${item.rank==1?'rank-1':(item.rank==2?'rank-2':(item.rank==3?'rank-3':'rank-other'))}"
                              th:text="${item.rank}">
                            1
                        </span>

                        <!-- Medicamento -->
                        <div class="pl-3 min-w-0">

                            <div class="text-sm font-semibold truncate text-indigo-950"
                                 th:text="${item.medicamento}">
                                —
                            </div>

                            <div class="progress-track">

                                <div class="progress-fill"
                                     style="background:linear-gradient(90deg,#f59e0b,#fbbf24)"
                                     th:style="'width:'+${item.porcentaje}+'%'">
                                </div>

                            </div>

                        </div>

                        <!-- Solicitudes -->
                        <div class="text-right text-sm font-bold text-indigo-950"
                             th:text="${item.totalSolicitudes}">
                            0
                        </div>

                        <!-- Unidades -->
                        <div class="text-right text-xs text-indigo-950/50"
                             th:text="${item.totalUnidades}">
                            0
                        </div>

                        <!-- Porcentaje -->
                        <div class="text-right text-xs font-bold text-amber-900"
                             th:text="${item.porcentaje}+'%'">
                            0%
                        </div>

                    </div>

                </div>

                <!-- Sin datos -->
                <div th:if="${topHistorico==null or topHistorico.empty}"
                     class="px-6 py-8 text-center text-sm text-indigo-950/40">

                    Sin datos históricos disponibles

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
