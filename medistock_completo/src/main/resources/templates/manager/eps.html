<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de EPS | Medistock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    table {
      table-layout: auto;
      width: 100%;
    }

    thead th {
      white-space: nowrap;
    }

    td.acciones {
      white-space: nowrap;
    }

    tbody td {
      word-break: break-word;
    }
  </style>
    <link rel="icon" type="image/png" href="/Imagenes/Logo.png"/>
</head>

<body
  class="bg-gradient-to-r from-indigo-500 via-sky-500 to-cyan-400 min-h-screen flex justify-center items-start py-10">

    <!-- ══ HEADER STICKY MEDISTOCK ══════════════════════════════════════ -->
    <style>
        body { margin-top: 62px !important; }
        #ms-header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100vw !important;
            z-index: 99999 !important;
            background: linear-gradient(90deg, rgba(30,27,100,0.82) 0%, rgba(14,116,144,0.70) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 4px 24px rgba(0,0,0,0.22);
            box-sizing: border-box;
            padding: 10px 28px;
        }
        #ms-header-inner {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        #ms-header .ms-accent-line {
            width: 3px; height: 32px; border-radius: 9999px;
            background: linear-gradient(180deg,#67e8f9,#818cf8);
            flex-shrink: 0;
        }
        #ms-header .ms-logo-link {
            display: flex; align-items: center;
            gap: 12px; text-decoration: none;
        }
        #ms-header .ms-logo-wrap {
            position: relative; flex-shrink: 0;
        }
        #ms-header .ms-logo-glow {
            position: absolute; inset: 0;
            background: rgba(103,232,249,0.25);
            filter: blur(10px); border-radius: 9999px;
        }
        #ms-header .ms-logo-img {
            position: relative; height: 38px; width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }
        #ms-header .ms-logo-img:hover { transform: scale(1.1); }
        #ms-header .ms-brand { line-height: 1; }
        #ms-header .ms-brand-name {
            color: white; font-weight: 900; font-size: 1rem;
            letter-spacing: 0.08em; font-family: Inter, sans-serif;
            text-shadow: 0 1px 8px rgba(0,0,0,0.25);
        }
        #ms-header .ms-brand-name span { color: #67e8f9; }
        #ms-header .ms-brand-sub {
            color: rgba(255,255,255,0.45); font-size: 0.62rem;
            font-weight: 500; letter-spacing: 0.12em;
            text-transform: uppercase; margin-top: 2px;
        }
        #ms-header .ms-sep {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.12), transparent);
            margin-left: 8px;
        }
        #ms-header .ms-status {
            display: flex; align-items: center;
            gap: 6px; flex-shrink: 0;
        }
        #ms-header .ms-dot {
            width: 7px; height: 7px; border-radius: 9999px;
            background: #34d399;
            box-shadow: 0 0 8px rgba(52,211,153,0.8);
            animation: ms-pulse 2s infinite;
        }
        #ms-header .ms-status-txt {
            color: rgba(255,255,255,0.45); font-size: 0.68rem;
            font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
        }
        @keyframes ms-pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
    </style>
    <header id="ms-header">
        <div id="ms-header-inner">
            <div class="ms-accent-line"></div>
            <a href="/" class="ms-logo-link">
                <div class="ms-logo-wrap">
                    <div class="ms-logo-glow"></div>
                    <img src="/Imagenes/Logo.png" alt="MEDISTOCK" class="ms-logo-img"/>
                </div>
                <div class="ms-brand">
                    <div class="ms-brand-name">MEDI<span>STOCK</span></div>
                    <div class="ms-brand-sub">Gestión Inteligente</div>
                </div>
            </a>
            <div class="ms-sep"></div>
            <div class="ms-status">
                <div class="ms-dot"></div>
                <span class="ms-status-txt">Sistema activo</span>
            </div>
        </div>
    </header>
    <!-- ══ FIN HEADER ═══════════════════════════════════════════════════ -->

<div class="w-full max-w-7xl bg-white/20 backdrop-blur-lg rounded-3xl shadow-2xl grid md:grid-cols-3 overflow-hidden">

    <div class="col-span-2 p-10 flex flex-col gap-8">

      <div class="flex justify-between items-center">
        <a href="/manager/dashboard"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-xl shadow-md flex items-center gap-2 transition hover:scale-105">
          <i class="ph ph-arrow-left"></i> Volver al panel
        </a>
        <h2 class="text-3xl font-extrabold text-white drop-shadow-md text-center flex-1">
          <span th:text="${eps.id != null ? 'Editar EPS' : 'Registrar EPS'}"></span>
        </h2>
      </div>

      <form th:action="@{${eps.id} != null ? '/manager/eps/editar/' + ${eps.id} : '/manager/eps/crear'}" method="post"
        class="grid gap-6 bg-white/30 p-6 rounded-2xl shadow-inner">

        <div>
          <label class="text-white font-semibold">Nombre:</label>
          <input type="text" name="nombre" required th:value="${eps.nombre}"
            class="w-full p-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:outline-none shadow-inner" />
        </div>

        <div>
          <label class="text-white font-semibold">Descripción:</label>
          <textarea name="descripcion" rows="3" th:text="${eps.descripcion}"
            class="w-full p-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:outline-none shadow-inner"></textarea>
        </div>

        <div class="flex justify-center">
          <button type="submit"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transform transition hover:scale-105 flex items-center gap-2">
            <i class="ph ph-floppy-disk text-xl"></i>
            <span th:text="${eps.id != null ? 'Actualizar' : 'Guardar'}">Guardar</span>
          </button>
        </div>
      </form>

      <form th:action="@{/manager/eps}" method="get" class="flex flex-col md:flex-row gap-3">
        <input type="text" name="keyword" placeholder="Buscar por nombre..." th:value="${param.keyword}"
          class="flex-1 p-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:outline-none shadow-inner" />
        <button type="submit"
          class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-6 rounded-xl shadow-md transition transform hover:scale-105 flex items-center gap-2">
          <i class="ph ph-magnifying-glass text-xl"></i> Buscar
        </button>
        <a th:href="@{/manager/eps}"
          class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-6 rounded-xl shadow-md transition hover:scale-105 flex items-center gap-2">
          <i class="ph ph-list"></i> Mostrar todos
        </a>
      </form>

      <h3 class="text-white font-bold text-2xl text-center">EPS Registradas</h3>
      <div class="rounded-xl shadow-md w-full overflow-x-auto">
        <table class="w-full bg-white/80 rounded-xl text-lg">
          <thead class="bg-indigo-600 text-white text-lg">
            <tr>
              <th class="px-4 py-3 text-left"><i class="ph ph-building"></i> Nombre</th>
              <th class="px-4 py-3 text-left"><i class="ph ph-text-align-left"></i> Descripción</th>
              <th class="px-4 py-3 text-left"><i class="ph ph-gear"></i> Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="e, iterStat : ${epsList}" th:if="${iterStat.index < 5}"
              class="hover:bg-indigo-100 transition text-lg border-b border-gray-200">
              <td class="px-4 py-3" th:text="${e.nombre}"></td>
              <td class="px-4 py-3" th:text="${e.descripcion}"></td>
              <td class="px-4 py-3 flex gap-4 items-center acciones">
                <a th:href="@{'/manager/eps/editar/' + ${e.id}}"
                  class="p-2 rounded-full bg-indigo-100 hover:bg-indigo-200 text-indigo-700 hover:text-indigo-900 transition transform hover:scale-110 shadow-md"
                  title="Editar">
                  <i class="ph ph-pencil text-2xl"></i>
                </a>
                <a th:href="@{'/manager/eps/eliminar/' + ${e.id}}"
                  class="p-2 rounded-full bg-red-100 hover:bg-red-200 text-red-700 hover:text-red-900 transition transform hover:scale-110 shadow-md"
                  title="Eliminar" onclick="return confirm('¿Estás seguro de eliminar esta EPS?');">
                  <i class="ph ph-trash text-2xl"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="flex justify-center items-center gap-2 mt-4">
        <a th:if="${currentPage > 1}" th:href="@{/manager/eps(page=${currentPage - 1}, keyword=${param.keyword})}"
          class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
          &laquo; Anterior
        </a>
        <span th:text="'Página ' + ${currentPage} + ' de ' + ${totalPages}" class="px-4 py-2 text-white"></span>
        <a th:if="${currentPage < totalPages}"
          th:href="@{/manager/eps(page=${currentPage + 1}, keyword=${param.keyword})}"
          class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
          Siguiente &raquo;
        </a>
      </div>
    </div>

    <div class="hidden md:block relative overflow-hidden">
      <img src="/Imagenes/Umedicamentos.jpg" alt="Imagen ilustrativa EPS"
        class="w-full h-full object-cover filter brightness-90 transition-transform duration-500 hover:scale-105" />
    </div>
  </div>

  <script>

    window.addEventListener("beforeunload", () => {
      sessionStorage.setItem("scrollPos", window.scrollY);
    });
    window.addEventListener("load", () => {
      const scrollPos = sessionStorage.getItem("scrollPos");
      if (scrollPos) {
        window.scrollTo(0, parseInt(scrollPos));
      }
    });
  </script>

</body>

</html>
