<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Usuario | Medistock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.8s ease-out forwards;
        }

        input,
        select {
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
            transform: scale(1.02);
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
    <link rel="icon" type="image/png" href="/Imagenes/Logo.png"/>
</head>

<body
    class="bg-gradient-to-r from-indigo-700 via-blue-500 to-cyan-400 min-h-screen flex items-center justify-center px-4 py-10">

    <!-- ══ HEADER STICKY MEDISTOCK ══════════════════════════════════════ -->
    <style>
        body { margin-top: 62px !important; }
        #ms-header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100vw !important;
            z-index: 99999 !important;
            background: linear-gradient(90deg, rgba(30,27,100,0.82) 0%, rgba(14,116,144,0.70) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 4px 24px rgba(0,0,0,0.22);
            box-sizing: border-box;
            padding: 10px 28px;
        }
        #ms-header-inner {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        #ms-header .ms-accent-line {
            width: 3px; height: 32px; border-radius: 9999px;
            background: linear-gradient(180deg,#67e8f9,#818cf8);
            flex-shrink: 0;
        }
        #ms-header .ms-logo-link {
            display: flex; align-items: center;
            gap: 12px; text-decoration: none;
        }
        #ms-header .ms-logo-wrap {
            position: relative; flex-shrink: 0;
        }
        #ms-header .ms-logo-glow {
            position: absolute; inset: 0;
            background: rgba(103,232,249,0.25);
            filter: blur(10px); border-radius: 9999px;
        }
        #ms-header .ms-logo-img {
            position: relative; height: 38px; width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }
        #ms-header .ms-logo-img:hover { transform: scale(1.1); }
        #ms-header .ms-brand { line-height: 1; }
        #ms-header .ms-brand-name {
            color: white; font-weight: 900; font-size: 1rem;
            letter-spacing: 0.08em; font-family: Inter, sans-serif;
            text-shadow: 0 1px 8px rgba(0,0,0,0.25);
        }
        #ms-header .ms-brand-name span { color: #67e8f9; }
        #ms-header .ms-brand-sub {
            color: rgba(255,255,255,0.45); font-size: 0.62rem;
            font-weight: 500; letter-spacing: 0.12em;
            text-transform: uppercase; margin-top: 2px;
        }
        #ms-header .ms-sep {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.12), transparent);
            margin-left: 8px;
        }
        #ms-header .ms-status {
            display: flex; align-items: center;
            gap: 6px; flex-shrink: 0;
        }
        #ms-header .ms-dot {
            width: 7px; height: 7px; border-radius: 9999px;
            background: #34d399;
            box-shadow: 0 0 8px rgba(52,211,153,0.8);
            animation: ms-pulse 2s infinite;
        }
        #ms-header .ms-status-txt {
            color: rgba(255,255,255,0.45); font-size: 0.68rem;
            font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
        }
        @keyframes ms-pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
    </style>
    <header id="ms-header">
        <div id="ms-header-inner">
            <div class="ms-accent-line"></div>
            <a href="/" class="ms-logo-link">
                <div class="ms-logo-wrap">
                    <div class="ms-logo-glow"></div>
                    <img src="/Imagenes/Logo.png" alt="MEDISTOCK" class="ms-logo-img"/>
                </div>
                <div class="ms-brand">
                    <div class="ms-brand-name">MEDI<span>STOCK</span></div>
                    <div class="ms-brand-sub">Gestión Inteligente</div>
                </div>
            </a>
            <div class="ms-sep"></div>
            <div class="ms-status">
                <div class="ms-dot"></div>
                <span class="ms-status-txt">Sistema activo</span>
            </div>
        </div>
    </header>
    <!-- ══ FIN HEADER ═══════════════════════════════════════════════════ -->

<div
        class="bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl w-full max-w-6xl overflow-hidden grid md:grid-cols-2 animate-fadeIn">

        <div
            class="relative bg-gradient-to-b from-indigo-700 via-blue-600 to-cyan-500 flex flex-col justify-center items-center text-center p-10 text-white">
            <div class="absolute inset-0 bg-black/30 rounded-3xl"></div>
            <div class="relative z-10">
                <img src="https://cdn-icons-png.flaticon.com/512/2920/2920323.png" alt="Imagen Registro"
                    class="w-48 mx-auto mb-6 drop-shadow-lg">
                <h2 class="text-4xl font-extrabold mb-4">¡Bienvenido a Medistock!</h2>
                <p class="text-lg font-medium opacity-90 mb-6">
                    Regístrate y accede a los servicios médicos disponibles para ti.
                </p>
                <a href="/"
                    class="inline-flex items-center gap-2 bg-white text-indigo-700 font-bold py-2 px-5 rounded-xl shadow-md hover:bg-indigo-50 transition">
                    <i class="ph ph-house"></i> Volver al inicio
                </a>
            </div>
        </div>

        <div class="bg-white/90 backdrop-blur-xl p-10 md:p-12">
            <h3 class="text-3xl font-bold text-indigo-700 mb-8 text-center">
                Crear Cuenta
            </h3>

            <div th:if="${mensajeError}" class="bg-red-500 text-white text-center py-3 mb-4 rounded-lg shadow-md">
                <p th:text="${mensajeError}"></p>
            </div>

            <form th:action="@{/registro}" method="post" class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div>
                    <label class="block text-indigo-700 font-semibold mb-1">Nombre:</label>
                    <input type="text" name="nombre" required placeholder="Tu nombre"
                        class="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500" />
                </div>

                <div>
                    <label class="block text-indigo-700 font-semibold mb-1">Apellido:</label>
                    <input type="text" name="apellido" required placeholder="Tu apellido"
                        class="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500" />
                </div>

                <div>
                    <label class="block text-indigo-700 font-semibold mb-1">Identificación:</label>
                    <input type="text" name="identificacion" required placeholder="Documento o cédula"
                        class="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500" />
                </div>

                <div>
                    <label class="block text-indigo-700 font-semibold mb-1">Dirección:</label>
                    <input type="text" name="direccion" placeholder="Tu dirección"
                        class="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500" />
                </div>

                <div>
                    <label class="block text-indigo-700 font-semibold mb-1">Correo electrónico:</label>
                    <input type="email" name="correo" required placeholder="ejemplo@correo.com"
                        class="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500" />
                </div>

                <div>
                    <label class="block text-indigo-700 font-semibold mb-1">Edad:</label>
                    <input type="number" name="edad" min="0" placeholder="Edad"
                        class="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500" />
                </div>

                <div>
                    <label class="block text-indigo-700 font-semibold mb-1">Contacto:</label>
                    <input type="tel" name="contacto" placeholder="Teléfono o celular"
                        class="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500" />
                </div>

                <div>
                    <label class="block text-indigo-700 font-semibold mb-1">Género:</label>
                    <select name="genero"
                        class="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500">
                        <option value="No especificado">No especificado</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Masculino">Masculino</option>
                    </select>
                </div>

                <div>
                    <label class="block text-indigo-700 font-semibold mb-1">Régimen:</label>
                    <select name="regimen"
                        class="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500">
                        <option value="No especificado">No especificado</option>
                        <option value="Contributivo">Contributivo</option>
                        <option value="Subsidiado">Subsidiado</option>
                    </select>
                </div>

                <div>
                    <label class="block text-indigo-700 font-semibold mb-1">EPS:</label>
                    <select name="eps.id"
                        class="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500">
                        <option value="" selected>Seleccione una EPS</option>
                        <option th:each="e : ${epsList}" th:value="${e.id}" th:text="${e.nombre}"></option>
                    </select>
                </div>

                <div>
                    <label class="block text-indigo-700 font-semibold mb-1">Rol:</label>
                    <select name="rol" required
                        class="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500">
                        <option value="USER" selected>Usuario</option>
                    </select>
                </div>

                <div class="sm:col-span-2 mt-4 flex justify-center">
                    <button type="submit"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-xl shadow-lg transition">
                        <i class="ph ph-user-plus text-xl mr-2"></i> Crear Cuenta
                    </button>
                </div>
            </form>

            <p class="text-center text-gray-500 text-sm mt-8">
                © 2025 <span class="font-semibold text-indigo-600">Medistock</span> — Tu bienestar, nuestra
                prioridad.
            </p>
        </div>
    </div>
</body>

</html>
