<div th:fragment="chatbot">
    <style>
        .medistock-chat-fab {
            position: fixed;
            right: max(1.25rem, env(safe-area-inset-right));
            bottom: max(1.25rem, env(safe-area-inset-bottom));
            z-index: 80;
            display: grid;
            width: 3.75rem;
            height: 3.75rem;
            place-items: center;
            border: 0;
            border-radius: 9999px;
            color: #fff;
            background: linear-gradient(135deg, #0891b2, #2563eb);
            box-shadow: 0 12px 35px rgba(8, 145, 178, .4);
            cursor: pointer;
            font-size: 1.65rem;
        }
        .medistock-chat-panel {
            position: fixed;
            right: max(1.25rem, env(safe-area-inset-right));
            bottom: max(5.75rem, calc(env(safe-area-inset-bottom) + 4.5rem));
            z-index: 80;
            display: flex;
            width: min(23rem, calc(100vw - 2rem));
            height: min(34rem, calc(100dvh - 7rem));
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, .24);
            border-radius: 1.25rem;
            color: #e2e8f0;
            background: #0f172a;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .55);
        }
        .medistock-chat-panel[hidden] { display: none; }
        .medistock-chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: linear-gradient(110deg, #0e7490, #1d4ed8);
        }
        .medistock-chat-messages {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: .75rem;
            overflow-y: auto;
            padding: 1rem;
        }
        .medistock-chat-message {
            max-width: 88%;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border-radius: 1rem;
            padding: .7rem .85rem;
            font-size: .875rem;
            line-height: 1.45;
        }
        .medistock-chat-message.bot {
            align-self: flex-start;
            background: #1e293b;
        }
        .medistock-chat-message.user {
            align-self: flex-end;
            background: #075985;
        }
        .medistock-chat-form {
            display: flex;
            gap: .5rem;
            border-top: 1px solid rgba(148, 163, 184, .18);
            padding: .75rem;
        }
        .medistock-chat-input {
            min-width: 0;
            flex: 1;
            border: 1px solid #334155;
            border-radius: .75rem;
            outline: none;
            background: #020617;
            padding: .7rem .8rem;
            color: #f8fafc;
        }
        .medistock-chat-input:focus { border-color: #22d3ee; }
        .medistock-chat-send {
            width: 2.8rem;
            flex: 0 0 auto;
            border: 0;
            border-radius: .75rem;
            background: #0891b2;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .medistock-chat-send:disabled { cursor: wait; opacity: .55; }
        .medistock-chat-status {
            min-height: 1rem;
            padding: 0 .85rem .5rem;
            color: #fbbf24;
            font-size: .75rem;
        }
        @media (max-width: 480px) {
            .medistock-chat-panel {
                right: .75rem;
                bottom: calc(env(safe-area-inset-bottom) + 5rem);
                width: calc(100vw - 1.5rem);
                height: min(34rem, calc(100dvh - 6rem));
            }
            .medistock-chat-fab {
                right: 1rem;
                bottom: calc(env(safe-area-inset-bottom) + 1rem);
            }
        }
    </style>

    <section id="medistockChatPanel" class="medistock-chat-panel"
             role="dialog" aria-modal="false" aria-labelledby="medistockChatTitle" hidden>
        <header class="medistock-chat-header">
            <div>
                <h2 id="medistockChatTitle" class="font-bold">Asistente MediStock</h2>
                <p class="text-xs text-cyan-100">Ayuda con la plataforma y tus solicitudes</p>
            </div>
            <button id="medistockChatClose" type="button" aria-label="Cerrar chat"
                    class="grid h-9 w-9 place-items-center rounded-full hover:bg-white/15">
                <i class="ph ph-x text-xl" aria-hidden="true"></i>
            </button>
        </header>
        <div id="medistockChatMessages" class="medistock-chat-messages" aria-live="polite">
            <div class="medistock-chat-message bot">
                ¡Hola! Puedo ayudarte con MediStock, el inventario de tu EPS y tus solicitudes.
            </div>
        </div>
        <div id="medistockChatStatus" class="medistock-chat-status" role="status"></div>
        <form id="medistockChatForm" class="medistock-chat-form">
            <label class="sr-only" for="medistockChatInput">Escribe tu mensaje</label>
            <input id="medistockChatInput" class="medistock-chat-input" type="text"
                   maxlength="1000" autocomplete="off" placeholder="Escribe tu pregunta…"
                   required />
            <button id="medistockChatSend" class="medistock-chat-send" type="submit"
                    aria-label="Enviar mensaje">
                <i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>
            </button>
        </form>
    </section>

    <button id="medistockChatFab" class="medistock-chat-fab" type="button"
            aria-label="Abrir asistente MediStock" aria-expanded="false"
            aria-controls="medistockChatPanel">
        <i class="ph ph-chat-circle-dots" aria-hidden="true"></i>
    </button>

    <script>
        (() => {
            const panel = document.getElementById("medistockChatPanel");
            const fab = document.getElementById("medistockChatFab");
            const close = document.getElementById("medistockChatClose");
            const form = document.getElementById("medistockChatForm");
            const input = document.getElementById("medistockChatInput");
            const messages = document.getElementById("medistockChatMessages");
            const status = document.getElementById("medistockChatStatus");
            const send = document.getElementById("medistockChatSend");
            const history = [];

            function setOpen(open) {
                panel.hidden = !open;
                fab.setAttribute("aria-expanded", String(open));
                if (open) input.focus();
            }

            function addMessage(role, text) {
                const message = document.createElement("div");
                message.className = `medistock-chat-message ${role}`;
                message.textContent = text;
                messages.appendChild(message);
                messages.scrollTop = messages.scrollHeight;
            }

            fab.addEventListener("click", () => setOpen(panel.hidden));
            close.addEventListener("click", () => setOpen(false));
            document.addEventListener("keydown", event => {
                if (event.key === "Escape" && !panel.hidden) setOpen(false);
            });

            form.addEventListener("submit", async event => {
                event.preventDefault();
                const pregunta = input.value.trim();
                if (!pregunta || send.disabled) return;

                addMessage("user", pregunta);
                input.value = "";
                status.textContent = "Consultando…";
                send.disabled = true;

                try {
                    const response = await fetch("/usuario/chatbot/mensaje", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ pregunta, historial: history.slice(-10) })
                    });
                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.detail || "No fue posible enviar el mensaje.");
                    }

                    if (result.exito) {
                        addMessage("bot", result.respuesta);
                        history.push({ rol: "user", texto: pregunta });
                        history.push({ rol: "assistant", texto: result.respuesta });
                        if (history.length > 10) history.splice(0, history.length - 10);
                    } else {
                        status.textContent = result.respuesta;
                    }
                } catch (error) {
                    status.textContent = error.message || "Ocurrió un error al enviar el mensaje.";
                } finally {
                    send.disabled = false;
                    input.focus();
                }
            });
        })();
    </script>
</div>
