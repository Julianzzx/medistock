<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Medistock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="icon" type="image/png" href="/Imagenes/Logo.png"/>
</head>

<body
    class="bg-gradient-to-r from-indigo-500 via-sky-500 to-cyan-400 min-h-screen flex items-center justify-center p-6">

    <div
        class="w-full max-w-5xl bg-white/20 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden grid md:grid-cols-2">

        <div class="hidden md:block relative overflow-hidden">
            <img src="/Imagenes/logo2.jpeg" alt="Login"
                class="w-full h-full object-cover filter brightness-90 transition-transform duration-500 hover:scale-105 hover:brightness-100 hover:contrast-105 hover:saturate-125" />
        </div>

        <div class="p-10 flex flex-col gap-6">

            <div th:if="${param.correoCambiado}" id="correoCambiadoMessage"
                class="p-3 rounded-xl bg-green-500 text-white text-center font-bold shadow-md animate-bounce transition-all duration-700 mb-2">
                <i class="ph ph-envelope text-xl"></i> ¡Correo actualizado correctamente! Por favor inicia sesión
                nuevamente.
            </div>

            <div th:if="${param.logout}" id="logoutMessage"
                class="p-3 rounded-xl bg-green-500 text-white text-center font-bold shadow-md animate-bounce transition-all duration-700 mb-2">
                <i class="ph ph-check-circle text-xl"></i> Has cerrado sesión correctamente.
            </div>

            <h2
                class="text-3xl font-extrabold text-center text-white drop-shadow mb-6 flex items-center justify-center gap-2">
                <i class="ph ph-lock text-4xl"></i> Iniciar Sesión
            </h2>

            <form th:action="@{/login}" method="post" class="space-y-6">

                <div>
                    <label for="tipo" class="block text-sm font-semibold text-white mb-2">
                        <i class="ph ph-users-three mr-1"></i> Tipo de usuario:
                    </label>
                    <select id="tipo"
                        class="w-full p-3 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-400 transition text-gray-800">
                        <option value="user">Usuario</option>
                        <option value="manager">Manager</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div id="userFields">
                    <div>
                        <label for="userEmail" class="block text-sm font-semibold text-white mb-2">
                            <i class="ph ph-envelope-simple mr-1"></i> Correo electrónico:
                        </label>
                        <input type="email" id="userEmail" name="username" placeholder="usuario@ejemplo.com"
                            class="w-full p-3 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-400 transition text-gray-800"
                            required />
                    </div>
                    <div>
                        <label for="userId" class="block text-sm font-semibold text-white mb-2">
                            <i class="ph ph-identification-badge mr-1"></i> Identificación:
                        </label>
                        <input type="password" id="userId" name="password" placeholder="Tu identificación"
                            class="w-full p-3 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-400 transition text-gray-800"
                            required />
                    </div>
                </div>

                <div id="managerFields" style="display:none;">
                    <div>
                        <label for="managerId" class="block text-sm font-semibold text-white mb-2">
                            <i class="ph ph-user-circle-gear mr-1"></i> Identificación manager:
                        </label>
                        <input type="text" id="managerId" placeholder="ID manager"
                            class="w-full p-3 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-400 transition text-gray-800" />
                    </div>
                    <div>
                        <label for="managerCode" class="block text-sm font-semibold text-white mb-2">
                            <i class="ph ph-key mr-1"></i> Código de empleado:
                        </label>
                        <input type="password" id="managerCode" placeholder="Código de empleado"
                            class="w-full p-3 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-400 transition text-gray-800" />
                    </div>
                </div>

                <div id="adminFields" style="display:none;">
                    <div>
                        <label for="adminUser" class="block text-sm font-semibold text-white mb-2">
                            <i class="ph ph-user-circle mr-1"></i> Nombre de usuario Admin:
                        </label>
                        <input type="text" id="adminUser" placeholder="Nombre de usuario"
                            class="w-full p-3 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-400 transition text-gray-800" />
                    </div>
                    <div>
                        <label for="adminPass" class="block text-sm font-semibold text-white mb-2">
                            <i class="ph ph-key mr-1"></i> Contraseña:
                        </label>
                        <input type="password" id="adminPass" placeholder="Contraseña"
                            class="w-full p-3 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-400 transition text-gray-800" />
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-white text-indigo-600 py-3 px-4 rounded-full font-semibold shadow-md hover:bg-indigo-100 transform hover:scale-105 transition duration-300 flex items-center justify-center gap-2">
                    <i class="ph ph-sign-in text-xl"></i> Ingresar
                </button>

                <div class="flex gap-4 mt-4">
                    <button type="button" onclick="window.location.href='/oauth2/authorization/google'"
                        class="flex-1 bg-white text-red-600 py-3 px-4 rounded-full font-semibold shadow-md hover:bg-red-100 transform hover:scale-105 transition duration-300 flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" viewBox="0 0 533.5 544.3" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#4285F4"
                                d="M533.5 278.4c0-17.7-1.6-34.7-4.6-51.2H272v96.9h146.9c-6.3 34-25.1 62.8-53.6 82.1v68h86.5c50.6-46.6 79.7-115.3 79.7-195.8z" />
                            <path fill="#34A853"
                                d="M272 544.3c72.6 0 133.6-23.9 178.1-64.7l-86.5-68c-24 16.1-54.7 25.5-91.6 25.5-70.4 0-130-47.5-151.5-111.3h-89.7v69.9c44.3 88 135.1 149.6 241.2 149.6z" />
                            <path fill="#FBBC04"
                                d="M120.5 324.1c-10.6-31.7-10.6-65.9 0-97.6v-69.9H30.8c-39.3 77.8-39.3 169.4 0 247.2l89.7-69.7z" />
                            <path fill="#EA4335"
                                d="M272 107.7c38.7 0 73.4 13.3 100.7 39.6l75.3-75.3C400.9 24.7 342.7 0 272 0 165.9 0 75.1 61.6 30.8 149.6l89.7 69.9c21.5-63.8 81.1-111.8 151.5-111.8z" />
                        </svg>
                        Google
                    </button>

                    <button type="button" onclick="window.location.href='/oauth2/authorization/github'"
                        class="flex-1 bg-black text-white py-3 px-4 rounded-full font-semibold shadow-md hover:bg-gray-800 transform hover:scale-105 transition duration-300 flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.26.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.334-1.756-1.334-1.756-1.09-.745.082-.729.082-.729 1.205.084 1.838 1.238 1.838 1.238 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.762-1.605-2.665-.305-5.467-1.332-5.467-5.932 0-1.31.468-2.38 1.236-3.22-.124-.303-.536-1.523.117-3.176 0 0 1.008-.322 3.3 1.23.957-.266 1.983-.398 3.003-.403 1.02.005 2.047.137 3.006.403 2.29-1.552 3.296-1.23 3.296-1.23.655 1.653.243 2.873.12 3.176.77.84 1.234 1.91 1.234 3.22 0 4.61-2.807 5.624-5.48 5.922.43.37.823 1.102.823 2.222 0 1.606-.015 2.903-.015 3.293 0 .32.216.694.825.576C20.565 21.796 24 17.296 24 12c0-6.63-5.37-12-12-12z" />
                        </svg>
                        GitHub
                    </button>
                </div>

                <a th:href="@{/index}"
                    class="block text-center mt-3 bg-indigo-600 text-white font-bold py-3 px-5 rounded-xl shadow-lg hover:bg-indigo-700 transition duration-300 transform hover:scale-105">
                    <i class="ph ph-arrow-left"></i> Volver a la página de inicio
                </a>

                <div th:if="${param.error}" class="mt-3 text-red-600 text-center font-medium">
                    <i class="ph ph-warning-circle"></i> Credenciales inválidas. Intenta de nuevo.
                </div>
            </form>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const tipoSelect = document.getElementById('tipo');
            const userFields = document.getElementById('userFields');
            const managerFields = document.getElementById('managerFields');
            const adminFields = document.getElementById('adminFields');
            const userEmail = document.getElementById('userEmail');
            const userId = document.getElementById('userId');
            const managerId = document.getElementById('managerId');
            const managerCode = document.getElementById('managerCode');
            const adminUser = document.getElementById('adminUser');
            const adminPass = document.getElementById('adminPass');

            function updateFields() {
                if (tipoSelect.value === 'manager') {
                    userFields.style.display = 'none';
                    managerFields.style.display = 'block';
                    adminFields.style.display = 'none';

                    userEmail.removeAttribute('name');
                    userId.removeAttribute('name');
                    managerId.setAttribute('name', 'username');
                    managerCode.setAttribute('name', 'password');
                    adminUser.removeAttribute('name');
                    adminPass.removeAttribute('name');

                    managerId.required = true;
                    managerCode.required = true;
                    userEmail.required = false;
                    userId.required = false;
                    adminUser.required = false;
                    adminPass.required = false;

                } else if (tipoSelect.value === 'admin') {
                    userFields.style.display = 'none';
                    managerFields.style.display = 'none';
                    adminFields.style.display = 'block';

                    userEmail.removeAttribute('name');
                    userId.removeAttribute('name');
                    managerId.removeAttribute('name');
                    managerCode.removeAttribute('name');
                    adminUser.setAttribute('name', 'username');
                    adminPass.setAttribute('name', 'password');

                    adminUser.required = true;
                    adminPass.required = true;
                    userEmail.required = false;
                    userId.required = false;
                    managerId.required = false;
                    managerCode.required = false;

                } else {
                    userFields.style.display = 'block';
                    managerFields.style.display = 'none';
                    adminFields.style.display = 'none';

                    managerId.removeAttribute('name');
                    managerCode.removeAttribute('name');
                    adminUser.removeAttribute('name');
                    adminPass.removeAttribute('name');
                    userEmail.setAttribute('name', 'username');
                    userId.setAttribute('name', 'password');

                    userEmail.required = true;
                    userId.required = true;
                    managerId.required = false;
                    managerCode.required = false;
                    adminUser.required = false;
                    adminPass.required = false;
                }
            }

            updateFields();
            tipoSelect.addEventListener('change', updateFields);

            const logoutMessage = document.getElementById("logoutMessage");
            if (logoutMessage) {
                setTimeout(() => {
                    logoutMessage.style.transition = "all 0.7s ease";
                    logoutMessage.style.opacity = 0;
                    logoutMessage.style.transform = "translateY(-20px)";
                    setTimeout(() => logoutMessage.style.display = "none", 700);
                }, 1500);
            }

            const correoMsg = document.getElementById("correoCambiadoMessage");
            if (correoMsg) {
                setTimeout(() => {
                    correoMsg.style.transition = "all 0.7s ease";
                    correoMsg.style.opacity = 0;
                    correoMsg.style.transform = "translateY(-20px)";
                    setTimeout(() => correoMsg.style.display = "none", 700);
                }, 3000);
            }
        });
    </script>
</body>

</html>
