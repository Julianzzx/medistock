<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitudes | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="icon" type="image/png" href="/Imagenes/Logo.png"/>
</head>

<body class="bg-gradient-to-r from-indigo-500 via-sky-500 to-cyan-400 min-h-screen py-12 flex flex-col items-center">

    <!-- ══ HEADER STICKY MEDISTOCK ══════════════════════════════════════ -->
    <style>
        body { margin-top: 62px !important; }
        #ms-header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100vw !important;
            z-index: 99999 !important;
            background: linear-gradient(90deg, rgba(30,27,100,0.82) 0%, rgba(14,116,144,0.70) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 4px 24px rgba(0,0,0,0.22);
            box-sizing: border-box;
            padding: 10px 28px;
        }
        #ms-header-inner {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        #ms-header .ms-accent-line {
            width: 3px; height: 32px; border-radius: 9999px;
            background: linear-gradient(180deg,#67e8f9,#818cf8);
            flex-shrink: 0;
        }
        #ms-header .ms-logo-link {
            display: flex; align-items: center;
            gap: 12px; text-decoration: none;
        }
        #ms-header .ms-logo-wrap {
            position: relative; flex-shrink: 0;
        }
        #ms-header .ms-logo-glow {
            position: absolute; inset: 0;
            background: rgba(103,232,249,0.25);
            filter: blur(10px); border-radius: 9999px;
        }
        #ms-header .ms-logo-img {
            position: relative; height: 38px; width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }
        #ms-header .ms-logo-img:hover { transform: scale(1.1); }
        #ms-header .ms-brand { line-height: 1; }
        #ms-header .ms-brand-name {
            color: white; font-weight: 900; font-size: 1rem;
            letter-spacing: 0.08em; font-family: Inter, sans-serif;
            text-shadow: 0 1px 8px rgba(0,0,0,0.25);
        }
        #ms-header .ms-brand-name span { color: #67e8f9; }
        #ms-header .ms-brand-sub {
            color: rgba(255,255,255,0.45); font-size: 0.62rem;
            font-weight: 500; letter-spacing: 0.12em;
            text-transform: uppercase; margin-top: 2px;
        }
        #ms-header .ms-sep {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.12), transparent);
            margin-left: 8px;
        }
        #ms-header .ms-status {
            display: flex; align-items: center;
            gap: 6px; flex-shrink: 0;
        }
        #ms-header .ms-dot {
            width: 7px; height: 7px; border-radius: 9999px;
            background: #34d399;
            box-shadow: 0 0 8px rgba(52,211,153,0.8);
            animation: ms-pulse 2s infinite;
        }
        #ms-header .ms-status-txt {
            color: rgba(255,255,255,0.45); font-size: 0.68rem;
            font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
        }
        @keyframes ms-pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
    </style>
    <header id="ms-header">
        <div id="ms-header-inner">
            <div class="ms-accent-line"></div>
            <a href="/" class="ms-logo-link">
                <div class="ms-logo-wrap">
                    <div class="ms-logo-glow"></div>
                    <img src="/Imagenes/Logo.png" alt="MEDISTOCK" class="ms-logo-img"/>
                </div>
                <div class="ms-brand">
                    <div class="ms-brand-name">MEDI<span>STOCK</span></div>
                    <div class="ms-brand-sub">Gestión Inteligente</div>
                </div>
            </a>
            <div class="ms-sep"></div>
            <div class="ms-status">
                <div class="ms-dot"></div>
                <span class="ms-status-txt">Sistema activo</span>
            </div>
        </div>
    </header>
    <!-- ══ FIN HEADER ═══════════════════════════════════════════════════ -->

<div class="w-full max-w-6xl bg-white/20 backdrop-blur-2xl rounded-3xl shadow-2xl p-10 border border-white/30">

        <h1
            class="text-4xl font-extrabold text-white text-center mb-10 drop-shadow-lg flex items-center justify-center gap-3">
            <i class="ph ph-notebook text-5xl"></i>
            Solicitudes de Usuarios
        </h1>

        <div class="flex flex-col md:flex-row justify-center items-center gap-4 mb-8">
            <form th:action="@{/admin/solicitudes/buscar}" method="get" class="flex gap-3">
                <input type="text" name="keyword" placeholder="Buscar solicitud..."
                    class="px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    th:value="${keyword}" />
                <button type="submit"
                    class="flex items-center gap-2 px-5 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition">
                    <i class="ph ph-magnifying-glass"></i> Buscar
                </button>
            </form>

            <a th:href="@{/admin/solicitudes}"
                class="flex items-center gap-2 px-5 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition">
                <i class="ph ph-list-dashes"></i> Mostrar Todo
            </a>
        </div>

        <div class="flex justify-center mb-6">
            <form th:action="@{/admin/solicitudes}" method="get" class="flex gap-3 items-center">

                <select name="farmaciaId"
                    class="px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">

                    <option value="">Todas las droguerías</option>

                    <option th:each="f : ${farmacias}" th:value="${f.id}" th:text="${f.nombre}"
                        th:selected="${farmaciaId == f.id}">
                    </option>

                </select>

                <button type="submit"
                    class="px-5 py-2 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 transition">
                    Filtrar
                </button>

            </form>
        </div>

        <div th:if="${!isManager}" class="flex justify-center gap-6 mb-8">
            <form th:action="@{/admin/solicitudes/aceptar-todas}" method="post">
                <input type="hidden" name="keyword" th:value="${keyword}" />
                <input type="hidden" name="page" th:value="${currentPage}" />
                <button type="submit"
                    class="flex items-center gap-2 px-6 py-3 bg-green-600 text-white rounded-xl shadow hover:bg-green-700 hover:scale-105 transition">
                    <i class="ph ph-check-circle text-lg"></i> Aceptar Todas
                </button>
            </form>

            <form th:action="@{/admin/solicitudes/rechazar-todas}" method="post">
                <input type="hidden" name="keyword" th:value="${keyword}" />
                <input type="hidden" name="page" th:value="${currentPage}" />
                <button type="submit"
                    class="flex items-center gap-2 px-6 py-3 bg-red-600 text-white rounded-xl shadow hover:bg-red-700 hover:scale-105 transition">
                    <i class="ph ph-x-circle text-lg"></i> Rechazar Todas
                </button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(solicitudes)}"
            class="flex items-center justify-center gap-2 text-white font-semibold text-lg bg-red-500/80 p-4 rounded-2xl shadow-md mb-6">
            <i class="ph ph-warning-circle text-xl"></i>
            No hay solicitudes pendientes.
        </div>

        <div th:each="solicitud : ${solicitudes}"
            class="flex flex-col md:flex-row items-center md:items-start gap-6 bg-white/95 p-6 rounded-2xl shadow-lg hover:shadow-indigo-400/50 hover:scale-[1.01] transition mb-6">

            <div class="w-16 h-16 flex items-center justify-center bg-indigo-100 rounded-xl shadow-inner">
                <i class="ph ph-clipboard-text text-3xl text-indigo-600"></i>
            </div>

            <div class="flex-1 w-full">
                <h3 class="text-xl font-bold text-indigo-700 mb-2"
                    th:text="${solicitud.medicamento != null ? solicitud.medicamento.nombre : 'Medicamento'}"></h3>

                <p class="text-gray-700 mb-1">
                    <span class="font-semibold">Usuario:</span>
                    <span
                        th:text="${solicitud.usuario != null ? solicitud.usuario.nombre + ' ' + solicitud.usuario.apellido : 'Sin usuario'}"></span>
                </p>

                <p class="text-gray-700 mb-1">
                    <span class="font-semibold">Cantidad:</span>
                    <span th:text="${solicitud.cantidad}"></span>
                </p>

                <p class="text-gray-700 mb-1">
                    <span class="font-semibold">Farmacia:</span>
                    <span
                        th:text="${solicitud.medicamento != null && solicitud.medicamento.farmacia != null ? solicitud.medicamento.farmacia.nombre : 'N/A'}"></span>
                </p>
            </div>

            <div class="flex flex-col justify-center items-center md:items-end gap-2 w-full md:w-auto">

                <form th:if="${!isManager}" th:action="@{'/admin/solicitud/' + ${solicitud.id} + '/aceptar'}"
                    method="post">
                    <input type="hidden" name="keyword" th:value="${keyword}" />
                    <input type="hidden" name="page" th:value="${currentPage}" />
                    <button type="submit"
                        class="flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-xl shadow hover:bg-green-600 hover:scale-105 transition">
                        <i class="ph ph-check-circle"></i> Aceptar
                    </button>
                </form>

                <form th:if="${!isManager}" th:action="@{'/admin/solicitud/' + ${solicitud.id} + '/rechazar'}"
                    method="post">
                    <input type="hidden" name="keyword" th:value="${keyword}" />
                    <input type="hidden" name="page" th:value="${currentPage}" />
                    <button type="submit"
                        class="flex items-center gap-2 px-4 py-2 bg-red-500 text-white rounded-xl shadow hover:bg-red-600 hover:scale-105 transition">
                        <i class="ph ph-x-circle"></i> Rechazar
                    </button>
                </form>

                <div th:if="${isManager}" class="text-gray-400 italic text-sm">
                    Modo Manager: no se pueden gestionar solicitudes
                </div>
            </div>
        </div>

        <div class="flex justify-center items-center gap-3 mt-8" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 1}"
                th:href="@{/admin/solicitudes(page=${currentPage - 1}, keyword=${keyword}, farmaciaId=${farmaciaId})}"
                class="px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-800 transition">
                ← Anterior
            </a>

            <span class="px-4 py-2 bg-white/20 text-white rounded-lg shadow">
                Página <span th:text="${currentPage}"></span> de <span th:text="${totalPages}"></span>
            </span>

            <a th:if="${currentPage < totalPages}"
                th:href="@{/admin/solicitudes(page=${currentPage + 1}, keyword=${keyword}, farmaciaId=${farmaciaId})}"
                class="px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-800 transition">
                Siguiente →
            </a>
        </div>

        <div class="flex justify-center mt-10">
            <a th:if="${!isManager}" href="/admin/dashboard"
                class="inline-flex items-center gap-2 bg-gray-800 hover:bg-gray-900 text-white font-bold px-8 py-3 rounded-full shadow-lg transition transform hover:scale-110">
                <i class="ph ph-arrow-left text-lg"></i> Volver al Dashboard
            </a>
        </div>
    </div>

</body>

</html>
