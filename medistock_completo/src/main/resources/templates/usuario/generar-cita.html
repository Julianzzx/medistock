<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generar Cita | Medistock</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/Imagenes/Logo.png"/>
</head>
<body class="bg-gradient-to-r from-indigo-500 via-sky-500 to-cyan-400 min-h-screen flex items-center justify-center">

    <!-- ══ HEADER STICKY MEDISTOCK ══════════════════════════════════════ -->
    <style>
        body { margin-top: 62px !important; }
        #ms-header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100vw !important;
            z-index: 99999 !important;
            background: linear-gradient(90deg, rgba(30,27,100,0.82) 0%, rgba(14,116,144,0.70) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 4px 24px rgba(0,0,0,0.22);
            box-sizing: border-box;
            padding: 10px 28px;
        }
        #ms-header-inner {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        #ms-header .ms-accent-line {
            width: 3px; height: 32px; border-radius: 9999px;
            background: linear-gradient(180deg,#67e8f9,#818cf8);
            flex-shrink: 0;
        }
        #ms-header .ms-logo-link {
            display: flex; align-items: center;
            gap: 12px; text-decoration: none;
        }
        #ms-header .ms-logo-wrap {
            position: relative; flex-shrink: 0;
        }
        #ms-header .ms-logo-glow {
            position: absolute; inset: 0;
            background: rgba(103,232,249,0.25);
            filter: blur(10px); border-radius: 9999px;
        }
        #ms-header .ms-logo-img {
            position: relative; height: 38px; width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }
        #ms-header .ms-logo-img:hover { transform: scale(1.1); }
        #ms-header .ms-brand { line-height: 1; }
        #ms-header .ms-brand-name {
            color: white; font-weight: 900; font-size: 1rem;
            letter-spacing: 0.08em; font-family: Inter, sans-serif;
            text-shadow: 0 1px 8px rgba(0,0,0,0.25);
        }
        #ms-header .ms-brand-name span { color: #67e8f9; }
        #ms-header .ms-brand-sub {
            color: rgba(255,255,255,0.45); font-size: 0.62rem;
            font-weight: 500; letter-spacing: 0.12em;
            text-transform: uppercase; margin-top: 2px;
        }
        #ms-header .ms-sep {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.12), transparent);
            margin-left: 8px;
        }
        #ms-header .ms-status {
            display: flex; align-items: center;
            gap: 6px; flex-shrink: 0;
        }
        #ms-header .ms-dot {
            width: 7px; height: 7px; border-radius: 9999px;
            background: #34d399;
            box-shadow: 0 0 8px rgba(52,211,153,0.8);
            animation: ms-pulse 2s infinite;
        }
        #ms-header .ms-status-txt {
            color: rgba(255,255,255,0.45); font-size: 0.68rem;
            font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
        }
        @keyframes ms-pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
    </style>
    <header id="ms-header">
        <div id="ms-header-inner">
            <div class="ms-accent-line"></div>
            <a href="/" class="ms-logo-link">
                <div class="ms-logo-wrap">
                    <div class="ms-logo-glow"></div>
                    <img src="/Imagenes/Logo.png" alt="MEDISTOCK" class="ms-logo-img"/>
                </div>
                <div class="ms-brand">
                    <div class="ms-brand-name">MEDI<span>STOCK</span></div>
                    <div class="ms-brand-sub">Gestión Inteligente</div>
                </div>
            </a>
            <div class="ms-sep"></div>
            <div class="ms-status">
                <div class="ms-dot"></div>
                <span class="ms-status-txt">Sistema activo</span>
            </div>
        </div>
    </header>
    <!-- ══ FIN HEADER ═══════════════════════════════════════════════════ -->

<div class="bg-white/20 backdrop-blur-lg rounded-3xl shadow-2xl p-10 max-w-md w-full text-center">
  
  <h1 class="text-3xl font-bold text-white mb-6 drop-shadow-md">Generar Orden de Cita</h1>

  <div th:if="${msg}" id="msg" class="mb-4 bg-green-100 text-green-800 px-4 py-3 rounded-xl shadow" th:text="${msg}"></div>
  <div th:if="${error}" id="error" class="mb-4 bg-red-100 text-red-800 px-4 py-3 rounded-xl shadow" th:text="${error}"></div>

  <script>
    setTimeout(() => {
      document.getElementById('msg')?.remove();
      document.getElementById('error')?.remove();
    }, 3000);
  </script>

  <div th:if="${cita != null}" class="bg-white/90 p-6 rounded-2xl shadow-md">
    <p class="text-gray-700 text-lg mb-2">Tu orden de cita es:</p>
    <p id="codigo" class="text-2xl font-bold text-indigo-700 tracking-wider" th:text="${cita.codigo}">XXXXXX</p>
    <p class="text-sm text-gray-500 mt-2">Generado el 
      <span th:text="${#temporals.format(cita.fechaGeneracion, 'dd/MM/yyyy HH:mm')}"></span>
    </p>

    <button onclick="copiarCodigo()" 
            class="mt-4 bg-blue-500 text-white px-5 py-2 rounded-xl shadow hover:bg-blue-600 transition">
      Copiar Orden
    </button>

    <a href="/usuario/farmacias" 
       class="mt-6 inline-block bg-indigo-600 text-white px-6 py-2 rounded-xl shadow hover:bg-indigo-700 transition">
      Usar este Orden
    </a>
  </div>

  <div th:if="${cita == null}" class="flex flex-col items-center">
    <p class="text-white mb-6">Aún no tienes una orden de ciita generado. Haz clic en el botón para generar una.</p>
    
    <form action="/usuario/generar-cita" method="post">
      <button type="submit"
              class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-xl font-semibold shadow-md transition">
        Generar Orden De Cita
      </button>
    </form>
  </div>

  <div class="mt-8">
    <a href="/usuario/dashboard"
       class="text-white underline hover:text-gray-200 transition">← Volver al Panel</a>
  </div>

</div>

<script>
  function copiarCodigo() {
    const codigo = document.getElementById("codigo").innerText;
    navigator.clipboard.writeText(codigo);
  }
</script>

    <div th:replace="~{fragments/chatbot-widget :: chatbot}"></div>
</body>
</html>
