<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Sanitas | Medistock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .card {
      position: relative;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }
    .card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(120deg, rgba(255,255,255,0.15), transparent 60%);
      transform: rotate(25deg);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .card:hover::before {
      opacity: 1;
    }
  </style>
    <link rel="icon" type="image/png" href="/Imagenes/Logo.png"/>
</head>
<body class="bg-gradient-to-r from-blue-600 via-sky-500 to-cyan-400 min-h-screen py-12">

    <!-- ══ HEADER STICKY MEDISTOCK ══════════════════════════════════════ -->
    <style>
        body { margin-top: 62px !important; }
        #ms-header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100vw !important;
            z-index: 99999 !important;
            background: linear-gradient(90deg, rgba(30,27,100,0.82) 0%, rgba(14,116,144,0.70) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 4px 24px rgba(0,0,0,0.22);
            box-sizing: border-box;
            padding: 10px 28px;
        }
        #ms-header-inner {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        #ms-header .ms-accent-line {
            width: 3px; height: 32px; border-radius: 9999px;
            background: linear-gradient(180deg,#67e8f9,#818cf8);
            flex-shrink: 0;
        }
        #ms-header .ms-logo-link {
            display: flex; align-items: center;
            gap: 12px; text-decoration: none;
        }
        #ms-header .ms-logo-wrap {
            position: relative; flex-shrink: 0;
        }
        #ms-header .ms-logo-glow {
            position: absolute; inset: 0;
            background: rgba(103,232,249,0.25);
            filter: blur(10px); border-radius: 9999px;
        }
        #ms-header .ms-logo-img {
            position: relative; height: 38px; width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }
        #ms-header .ms-logo-img:hover { transform: scale(1.1); }
        #ms-header .ms-brand { line-height: 1; }
        #ms-header .ms-brand-name {
            color: white; font-weight: 900; font-size: 1rem;
            letter-spacing: 0.08em; font-family: Inter, sans-serif;
            text-shadow: 0 1px 8px rgba(0,0,0,0.25);
        }
        #ms-header .ms-brand-name span { color: #67e8f9; }
        #ms-header .ms-brand-sub {
            color: rgba(255,255,255,0.45); font-size: 0.62rem;
            font-weight: 500; letter-spacing: 0.12em;
            text-transform: uppercase; margin-top: 2px;
        }
        #ms-header .ms-sep {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.12), transparent);
            margin-left: 8px;
        }
        #ms-header .ms-status {
            display: flex; align-items: center;
            gap: 6px; flex-shrink: 0;
        }
        #ms-header .ms-dot {
            width: 7px; height: 7px; border-radius: 9999px;
            background: #34d399;
            box-shadow: 0 0 8px rgba(52,211,153,0.8);
            animation: ms-pulse 2s infinite;
        }
        #ms-header .ms-status-txt {
            color: rgba(255,255,255,0.45); font-size: 0.68rem;
            font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
        }
        @keyframes ms-pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
    </style>
    <header id="ms-header">
        <div id="ms-header-inner">
            <div class="ms-accent-line"></div>
            <a href="/" class="ms-logo-link">
                <div class="ms-logo-wrap">
                    <div class="ms-logo-glow"></div>
                    <img src="/Imagenes/Logo.png" alt="MEDISTOCK" class="ms-logo-img"/>
                </div>
                <div class="ms-brand">
                    <div class="ms-brand-name">MEDI<span>STOCK</span></div>
                    <div class="ms-brand-sub">Gestión Inteligente</div>
                </div>
            </a>
            <div class="ms-sep"></div>
            <div class="ms-status">
                <div class="ms-dot"></div>
                <span class="ms-status-txt">Sistema activo</span>
            </div>
        </div>
    </header>
    <!-- ══ FIN HEADER ═══════════════════════════════════════════════════ -->

<div class="w-full max-w-7xl mx-auto bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-10 flex flex-col gap-10 border border-white/20">

    <div class="text-center">
      <h1 class="text-5xl font-extrabold text-white drop-shadow-lg tracking-wide">Dashboard Sanitas</h1>
      <p class="text-white/80 mt-3 text-lg md:text-xl">
        Bienvenido, consulta farmacias, gestiona solicitudes y genera tu cita
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">

      <div class="card bg-white/20 rounded-2xl shadow-lg p-6 border border-white/20 hover:border-blue-400/60 transition flex flex-col">
        <h2 class="text-blue-100 font-bold text-xl mb-6 flex items-center gap-2">
          <i class="ph ph-buildings text-2xl text-blue-300"></i> Farmacias
        </h2>
        <a href="/usuario/farmacias" class="group flex items-center gap-3 bg-white/30 text-blue-900 font-semibold px-5 py-4 rounded-xl shadow-md border border-white/20 transition hover:scale-105 hover:bg-blue-600 hover:text-white hover:border-blue-300/70">
          <i class="ph ph-first-aid text-2xl group-hover:animate-bounce"></i> Ver Farmacias
        </a>
      </div>

      <div class="card bg-white/20 rounded-2xl shadow-lg p-6 border border-white/20 hover:border-cyan-400/60 transition flex flex-col">
        <h2 class="text-cyan-100 font-bold text-xl mb-6 flex items-center gap-2">
          <i class="ph ph-list text-2xl text-cyan-300"></i> Mis Solicitudes
        </h2>
        <a href="/usuario/solicitudes" class="group flex items-center gap-3 bg-white/30 text-cyan-900 font-semibold px-5 py-4 rounded-xl shadow-md border border-white/20 transition hover:scale-105 hover:bg-cyan-600 hover:text-white hover:border-cyan-300/70">
          <i class="ph ph-envelope-open text-2xl group-hover:animate-bounce"></i> Ver Solicitudes
        </a>
      </div>

      <div class="card bg-white/20 rounded-2xl shadow-lg p-6 border border-white/20 hover:border-green-400/60 transition flex flex-col">
        <h2 class="text-green-100 font-bold text-xl mb-6 flex items-center gap-2">
          <i class="ph ph-calendar-check text-2xl text-green-300"></i> Generar Orden de Cita
        </h2>
        <form th:action="@{/usuario/generar-cita}" method="post" class="group flex items-center gap-3">
          <button type="submit" class="w-full flex items-center justify-center gap-3 bg-white/30 text-green-900 font-semibold px-5 py-4 rounded-xl shadow-md border border-white/20 transition hover:scale-105 hover:bg-green-600 hover:text-white hover:border-green-300/70">
            <i class="ph ph-check-square text-2xl group-hover:animate-bounce"></i> Generar
          </button>
        </form>
      </div>

    </div>

    <div class="flex justify-center">
      <div class="card bg-white/20 rounded-2xl shadow-lg p-6 w-full max-w-sm border border-white/20 hover:border-purple-400/60 transition flex flex-col items-center">
        <h2 class="text-purple-100 font-bold text-xl mb-6 flex items-center gap-2">
          <i class="ph ph-user text-2xl text-purple-300"></i> Mi Perfil
        </h2>
        <a href="/usuario/perfil" class="group flex items-center justify-center gap-3 bg-white/30 text-purple-900 font-semibold px-5 py-4 rounded-xl shadow-md border border-white/20 transition hover:scale-105 hover:bg-purple-600 hover:text-white hover:border-purple-300/70 w-full text-center">
          <i class="ph ph-identification-badge text-2xl group-hover:animate-bounce"></i> Ver Perfil
        </a>
      </div>
    </div>

    <div class="flex justify-center mt-6">
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="inline-flex items-center gap-3 bg-red-600 hover:bg-red-700 text-white font-bold px-8 py-4 rounded-full shadow-lg transition transform hover:scale-110 hover:shadow-red-400/50">
          <i class="ph ph-sign-out text-2xl"></i> Cerrar Sesión
        </button>
      </form>
    </div>

  </div>
    <div th:replace="~{fragments/chatbot-widget :: chatbot}"></div>
</body>
</html>
