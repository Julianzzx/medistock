spring.application.name=medistock

spring.datasource.url=jdbc:mysql://localhost:3306/medistock_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:configure-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.servlet.session.timeout=30m
server.port=8082

# Groq chatbot configuration. Keep the API key in the GROQ_API_KEY environment variable.
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_API_MODEL:openai/gpt-oss-20b}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
