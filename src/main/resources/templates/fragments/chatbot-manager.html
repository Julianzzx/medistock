<div th:fragment="chatbotManager">
    <style>
        .mgr-chat-fab {
            position: fixed;
            right: max(1.25rem, env(safe-area-inset-right));
            bottom: max(1.25rem, env(safe-area-inset-bottom));
            z-index: 80;
            display: grid;
            width: 3.75rem;
            height: 3.75rem;
            place-items: center;
            border: 0;
            border-radius: 9999px;
            color: #fff;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            box-shadow: 0 12px 35px rgba(124, 58, 237, .4);
            cursor: pointer;
            font-size: 1.65rem;
        }
        .mgr-chat-panel {
            position: fixed;
            right: max(1.25rem, env(safe-area-inset-right));
            bottom: max(5.75rem, calc(env(safe-area-inset-bottom) + 4.5rem));
            z-index: 80;
            display: flex;
            width: min(26rem, calc(100vw - 2rem));
            height: min(36rem, calc(100dvh - 7rem));
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, .24);
            border-radius: 1.25rem;
            color: #e2e8f0;
            background: #0f172a;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .55);
        }
        .mgr-chat-panel[hidden] { display: none; }
        .mgr-chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: linear-gradient(110deg, #6d28d9, #1d4ed8);
        }
        .mgr-chat-messages {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: .75rem;
            overflow-y: auto;
            padding: 1rem;
        }
        .mgr-chat-message {
            max-width: 90%;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border-radius: 1rem;
            padding: .7rem .85rem;
            font-size: .875rem;
            line-height: 1.45;
        }
        .mgr-chat-message.bot { align-self: flex-start; background: #1e293b; }
        .mgr-chat-message.user { align-self: flex-end; background: #4c1d95; }
        .mgr-chat-chips {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            padding: 0 1rem .6rem;
        }
        .mgr-chat-chip {
            border: 1px solid #475569;
            border-radius: 9999px;
            background: transparent;
            padding: .3rem .7rem;
            color: #cbd5e1;
            font-size: .72rem;
            cursor: pointer;
        }
        .mgr-chat-chip:hover { border-color: #a78bfa; color: #fff; }
        .mgr-chat-chip:disabled { cursor: wait; opacity: .5; }
        .mgr-chat-form {
            display: flex;
            gap: .5rem;
            border-top: 1px solid rgba(148, 163, 184, .18);
            padding: .75rem;
        }
        .mgr-chat-input {
            min-width: 0;
            flex: 1;
            border: 1px solid #334155;
            border-radius: .75rem;
            outline: none;
            background: #020617;
            padding: .7rem .8rem;
            color: #f8fafc;
        }
        .mgr-chat-input:focus { border-color: #a78bfa; }
        .mgr-chat-send {
            width: 2.8rem;
            flex: 0 0 auto;
            border: 0;
            border-radius: .75rem;
            background: #7c3aed;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .mgr-chat-send:disabled { cursor: wait; opacity: .55; }
        .mgr-chat-status {
            min-height: 1rem;
            padding: 0 .85rem .5rem;
            color: #fbbf24;
            font-size: .75rem;
        }
        @media (max-width: 480px) {
            .mgr-chat-panel {
                right: .75rem;
                bottom: calc(env(safe-area-inset-bottom) + 5rem);
                width: calc(100vw - 1.5rem);
                height: min(36rem, calc(100dvh - 6rem));
            }
            .mgr-chat-fab {
                right: 1rem;
                bottom: calc(env(safe-area-inset-bottom) + 1rem);
            }
        }
    </style>

    <section id="mgrChatPanel" class="mgr-chat-panel"
             role="dialog" aria-modal="false" aria-labelledby="mgrChatTitle" hidden>
        <header class="mgr-chat-header">
            <div>
                <h2 id="mgrChatTitle" class="font-bold">Analista MediStock</h2>
                <p class="text-xs text-violet-100">Explica el modelo y sugiere acciones</p>
            </div>
            <button id="mgrChatClose" type="button" aria-label="Cerrar chat"
                    class="grid h-9 w-9 place-items-center rounded-full hover:bg-white/15">
                <i class="ph ph-x text-xl" aria-hidden="true"></i>
            </button>
        </header>
        <div id="mgrChatMessages" class="mgr-chat-messages" aria-live="polite">
            <div class="mgr-chat-message bot">
                Hola. Puedo explicarte el gráfico y la tabla de vértices, decirte por qué el modelo
                recomienda esa cantidad de administradores y sugerirte qué hacer con el resultado.
                Si abres el simulador, también hablo de lo que estás probando.
            </div>
        </div>
        <div id="mgrChatChips" class="mgr-chat-chips">
            <button type="button" class="mgr-chat-chip">Explícame el gráfico</button>
            <button type="button" class="mgr-chat-chip">¿Qué me recomiendas?</button>
            <button type="button" class="mgr-chat-chip">¿Por qué ese punto es el óptimo?</button>
            <button type="button" class="mgr-chat-chip">¿Cómo leo la tabla de vértices?</button>
        </div>
        <div id="mgrChatStatus" class="mgr-chat-status" role="status"></div>
        <form id="mgrChatForm" class="mgr-chat-form">
            <label class="sr-only" for="mgrChatInput">Escribe tu pregunta</label>
            <input id="mgrChatInput" class="mgr-chat-input" type="text"
                   maxlength="1000" autocomplete="off" placeholder="Pregunta sobre el modelo…"
                   required />
            <button id="mgrChatSend" class="mgr-chat-send" type="submit" aria-label="Enviar mensaje">
                <i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>
            </button>
        </form>
    </section>

    <button id="mgrChatFab" class="mgr-chat-fab" type="button"
            aria-label="Abrir analista MediStock" aria-expanded="false"
            aria-controls="mgrChatPanel">
        <i class="ph ph-chart-line-up" aria-hidden="true"></i>
    </button>

    <script>
        (() => {
            const panel = document.getElementById("mgrChatPanel");
            const fab = document.getElementById("mgrChatFab");
            const close = document.getElementById("mgrChatClose");
            const form = document.getElementById("mgrChatForm");
            const input = document.getElementById("mgrChatInput");
            const messages = document.getElementById("mgrChatMessages");
            const chips = document.getElementById("mgrChatChips");
            const status = document.getElementById("mgrChatStatus");
            const send = document.getElementById("mgrChatSend");
            const history = [];

            function setOpen(open) {
                panel.hidden = !open;
                fab.setAttribute("aria-expanded", String(open));
                if (open) input.focus();
            }

            function addMessage(role, text) {
                const message = document.createElement("div");
                message.className = `mgr-chat-message ${role}`;
                message.textContent = text;
                messages.appendChild(message);
                messages.scrollTop = messages.scrollHeight;
            }

            function setBusy(busy) {
                send.disabled = busy;
                chips.querySelectorAll("button").forEach(chip => { chip.disabled = busy; });
            }

            // Si el simulador está abierto, el asistente habla de lo que el manager está probando.
            // El servidor vuelve a calcular esos parámetros: aquí solo se leen los campos de la página.
            function simulacionActual() {
                const caja = document.getElementById("simBox");
                const cap = document.getElementById("simCap");
                const sol = document.getElementById("simSol");
                const adm = document.getElementById("simAdm");
                if (!caja || !caja.open || !cap || !sol || !adm) return null;

                const capacidadPorAdmin = parseInt(cap.value, 10);
                const maxSolicitudes = parseInt(sol.value, 10);
                const maxAdmins = parseInt(adm.value, 10);
                if ([capacidadPorAdmin, maxSolicitudes, maxAdmins].some(Number.isNaN)) return null;

                const activo = document.querySelector("#simSeg button.border-indigo-400");
                const objetivo = activo && activo.dataset.obj ? activo.dataset.obj : "B";
                return { capacidadPorAdmin, maxSolicitudes, maxAdmins, objetivo };
            }

            async function preguntar(pregunta) {
                if (!pregunta || send.disabled) return;

                addMessage("user", pregunta);
                input.value = "";
                status.textContent = "Analizando…";
                setBusy(true);

                try {
                    const response = await fetch("/manager/chatbot/mensaje", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            pregunta,
                            historial: history.slice(-10),
                            simulacion: simulacionActual()
                        })
                    });
                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.detail || "No fue posible enviar el mensaje.");
                    }

                    if (result.exito) {
                        status.textContent = "";
                        addMessage("bot", result.respuesta);
                        history.push({ rol: "user", texto: pregunta });
                        history.push({ rol: "assistant", texto: result.respuesta });
                        if (history.length > 10) history.splice(0, history.length - 10);
                    } else {
                        status.textContent = result.respuesta;
                    }
                } catch (error) {
                    status.textContent = error.message || "Ocurrió un error al enviar el mensaje.";
                } finally {
                    setBusy(false);
                    input.focus();
                }
            }

            fab.addEventListener("click", () => setOpen(panel.hidden));
            close.addEventListener("click", () => setOpen(false));
            document.addEventListener("keydown", event => {
                if (event.key === "Escape" && !panel.hidden) setOpen(false);
            });
            chips.addEventListener("click", event => {
                const chip = event.target.closest("button");
                if (chip) preguntar(chip.textContent.trim());
            });
            form.addEventListener("submit", event => {
                event.preventDefault();
                preguntar(input.value.trim());
            });
        })();
    </script>
</div>
