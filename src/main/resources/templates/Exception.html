<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Excepción | Medistock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617; /* slate-950 */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Tech grid background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center bg-grid relative overflow-x-hidden p-4 md:p-8">

<!-- Iluminación ambiental de fondo (Tonos rose/indigo para Excepción) -->
<div class="absolute -top-40 -left-40 w-[600px] h-[600px] bg-rose-600/15 rounded-full blur-[140px] pointer-events-none"></div>
<div class="absolute top-1/2 -right-40 w-[600px] h-[600px] bg-indigo-500/10 rounded-full blur-[140px] pointer-events-none"></div>

<!-- CONTENEDOR PRINCIPAL DE EXCEPCIÓN -->
<main class="w-full max-w-lg z-10 animate-fade-in">
    <div class="glass-panel rounded-3xl p-8 sm:p-10 text-center relative overflow-hidden border border-slate-800 flex flex-col items-center gap-6 shadow-2xl">
        <div class="absolute -right-20 -top-20 w-64 h-64 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Icono de Advertencia Superior -->
        <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-rose-600 to-rose-400 flex items-center justify-center text-white shadow-lg shadow-rose-600/30 relative z-10 animate-pulse">
            <i class="ph ph-warning-circle text-4xl"></i>
        </div>

        <div class="space-y-2 relative z-10">
            <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-extrabold uppercase tracking-wider mb-1">
                <i class="ph ph-shield-warning"></i> Excepción del Sistema
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">¡Oops, ocurrió una excepción!</h1>
            <p class="text-slate-400 text-sm sm:text-base leading-relaxed">
                Se ha presentado un error inesperado en la ejecución del proceso. Por favor, inténtalo de nuevo más tarde.
            </p>
        </div>

        <!-- Imagen Contextual Opcional -->
        <div class="relative z-10 w-full flex justify-center my-2">
            <img src="/Imagenes/Error.png" alt="Excepción Medistock"
                 class="w-40 h-auto object-contain opacity-75 filter drop-shadow-md"/>
        </div>

        <!-- Botones de Acción (Solo Volver Atrás) -->
        <div class="flex items-center gap-3 w-full pt-4 border-t border-slate-800 relative z-10">
            <!-- Botón tipo "Atrás" (historial del navegador) -->
            <button onclick="history.back()"
                    class="w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white font-bold text-xs uppercase tracking-wider transition-all duration-300 border border-slate-700 shadow-sm">
                <i class="ph ph-arrow-left text-base"></i>
                <span>Volver Atrás</span>
            </button>
        </div>

    </div>
</main>

<script>
    window.addEventListener("load", () => {
        window.scrollTo(0, 0);
    });
</script>

</body>
</html>
